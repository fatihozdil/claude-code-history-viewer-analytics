name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    strategy:
      # Report every platform on a failure rather than cancelling the siblings,
      # since a break is usually specific to one of them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      # The VSIX is platform independent, so packaging it three times costs
      # build minutes without adding signal.
      - name: Build VSIX
        if: matrix.os == 'ubuntu-latest'
        run: npm run package
