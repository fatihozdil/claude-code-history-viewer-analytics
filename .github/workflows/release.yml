name: Release VSIX

# This workflow is authored in the private development repo but is only ever
# meant to RUN in the public repo, which is where releases are published from.
# The `github.repository` guard below makes it inert everywhere else, so a tag
# pushed in the private repo cannot publish anything.
#
# Publishing is gated twice:
#   1. `workflow_dispatch` only — a tag push builds and tests, never publishes.
#   2. the `release` environment's required reviewers (public repo, so free).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.13.3). Must already exist."
        required: true

jobs:
  build:
    if: github.repository == 'fatihozdil/claude-code-history-viewer-analytics'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches package.json version
        env:
          TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          TAG_VERSION="${TAG_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag $TAG_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Build VSIX
        run: npm run package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ./*.vsix
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          VSIX_FILE="$(ls ./*.vsix)"
          gh release create "$RELEASE_TAG" "$VSIX_FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes
