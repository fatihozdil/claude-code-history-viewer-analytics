name: Sync merged PR into private repo

# Runs after a maintainer merges a PR into this (public) repo's main branch.
# Since merging is already the maintainer's approval step, this pushes the
# same change straight to the private -src repo's main with no further
# review gate. If the patch doesn't apply cleanly, the job fails loudly
# instead of silently dropping the change — go apply it by hand.
#
# Uses pull_request_target, not pull_request: contributor PRs come from
# forks, and `pull_request` withholds repo secrets (PRIVATE_REPO_PAT) from
# fork-triggered runs, which fails the private-repo checkout with "Input
# required and not supplied: token". pull_request_target gets secrets, and
# is safe here specifically because the job never checks out or executes
# the PR's head ref/code — it only diffs merge_commit_sha^1..merge_commit_sha,
# both already-merged commits on the base repo's main.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  sync:
    # Public repo only. If this file is ever copied into the private repo,
    # it stays inert there instead of trying to sync the private repo into itself.
    if: github.repository == 'fatihozdil/claude-code-history-viewer-analytics' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build patch for the merged PR
        # Diffing merge_commit_sha^1 (main's tip before the merge) against
        # merge_commit_sha (main's tip after) gives the PR's total changeset
        # whether it landed as a squash, a real merge commit, or a rebase —
        # unlike `git format-patch`, which only handles a single commit and
        # silently mishandles actual two-parent merge commits.
        #
        # This workflow file itself is left out: it belongs only to the public
        # repo, and PRIVATE_REPO_PAT has no `workflow` scope, so pushing it to
        # the private repo is rejected (that is what failed when PR #12 merged).
        run: |
          BASE="${{ github.event.pull_request.merge_commit_sha }}^1"
          HEAD="${{ github.event.pull_request.merge_commit_sha }}"
          SELF=':(exclude).github/workflows/sync-merged-pr-to-private.yml'
          git diff "$BASE" "$HEAD" -- . "$SELF" > /tmp/pr.diff
          echo "--- patch summary ---"
          git diff --stat "$BASE" "$HEAD" -- . "$SELF"

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: fatihozdil/claude-code-history-viewer-analytics-src
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-repo
          fetch-depth: 0

      - name: Apply patch and push directly to private main
        working-directory: private-repo
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -s /tmp/pr.diff ]; then
            echo "Empty diff (nothing to sync — likely a docs/CI-only PR already excluded from the mirror) — nothing to do."
            exit 0
          fi

          if git apply --check --reverse /tmp/pr.diff 2>/dev/null; then
            echo "Patch already present in private repo (identical content) — nothing to do."
            exit 0
          fi

          if ! git apply --check /tmp/pr.diff 2>/dev/null; then
            echo "::error::Diff from public PR #$PR_NUMBER ($PR_URL) did not apply cleanly to private main. Apply it by hand: gh pr diff $PR_NUMBER | git apply (in the private repo), then commit and push."
            exit 1
          fi

          git apply /tmp/pr.diff
          git add -A
          git commit -m "$PR_TITLE" -m "Merged as public PR #$PR_NUMBER by @$PR_AUTHOR" -m "$PR_URL"

          git push origin main
